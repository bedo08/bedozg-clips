name: Taeglicher Shorts-Upload (BedoZg)

on:
  schedule:
    # Reserve-Zeitplan. Gestartet wird hauptsaechlich ueber cron-job.org
    # (GitHub verschluckt geplante Starts ab und zu). Krumme Minuten.
    # 11:23 UTC (12:23 Uhr Oesterreich im Winter): VOD vom Vorabend ist da.
    - cron: "23 11 * * *"
    # Zweiter Start holt nur nach, was heute noch fehlt (Tagessperre in daily_run.py).
    - cron: "53 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-upload
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Python-Pakete installieren
        run: pip install -q -r requirements.txt

      - name: Whisper-Modell aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1

      - name: YouTube-Zugangsdaten aus Secrets wiederherstellen
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YT_TOKEN" > token.json

      # Schluessel bei jedem Lauf pruefen, auch wenn es nichts hochzuladen gibt.
      # Sonst faellt ein abgelaufener Token erst beim ersten Upload auf
      # (Lehre Auto-Shorts, 13.-16.11.2026: tagelang still 0 Uploads).
      - name: YouTube-Schluessel und Kanal pruefen
        run: python -c "import upload; upload.assert_channel(upload.client())"

      # TikTok (seit 19.11.): App-Schluessel aus Secret, Token liegt verschluesselt
      # im Repo (tiktok_token.enc), weil TikTok ihn bei jedem Erneuern austauschen
      # kann und ein Secret sich aus dem Lauf heraus nicht aktualisieren laesst.
      - name: TikTok-Zugangsdaten wiederherstellen und pruefen
        continue-on-error: true
        env:
          TIKTOK_CLIENT: ${{ secrets.TIKTOK_CLIENT }}
          TIKTOK_KEY: ${{ secrets.TIKTOK_KEY }}
        run: |
          printf '%s' "$TIKTOK_CLIENT" > tiktok_client.json
          printf '%s' "$TIKTOK_KEY" > tiktok_key.txt
          # Schlaegt das Entschluesseln fehl, Datei loeschen: sonst wuerde unten
          # Muell verschluesselt und der gute Token im Repo ueberschrieben.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tiktok_token.enc -out tiktok_token.json -pass file:tiktok_key.txt \
            || { rm -f tiktok_token.json; echo "::error::TikTok-Token nicht entschluesselbar, Secret TIKTOK_KEY pruefen"; exit 1; }
          python tiktok_upload.py --whoami

      - name: VODs pruefen, Highlights schneiden, hochladen
        run: python daily_run.py

      - name: TikTok-Token wieder verschluesseln
        if: always()
        run: |
          if [ -f tiktok_token.json ] && [ -s tiktok_key.txt ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in tiktok_token.json -out tiktok_token.enc -pass file:tiktok_key.txt
          fi

      - name: Geheimnisse wieder entfernen
        if: always()
        run: rm -f client_secret.json token.json tiktok_client.json tiktok_token.json tiktok_key.txt

      - name: posted.json und vods.json zurueck ins Repo
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "actions@users.noreply.github.com"
          # Jede Datei einzeln (Lehre Deutschestreamerclips 2026-11-16): fehlt eine,
          # bricht ein gemeinsames "git add" ab und posted.json geht verloren.
          if [ -f posted.json ]; then git add posted.json; fi
          if [ -f vods.json ]; then git add vods.json; fi
          if [ -f tiktok_token.enc ]; then git add tiktok_token.enc; fi
          git diff --cached --quiet || git commit -m "Taeglicher Lauf: posted.json/vods.json aktualisiert"
          git pull --rebase -q && git push
