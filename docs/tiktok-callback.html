<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BedoZg TikTok Login</title>
<style>
  body { font-family: system-ui, sans-serif; background: #120a20; color: #fff; margin: 0; padding: 32px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  code { display: block; word-break: break-all; background: #241640; padding: 12px; border-radius: 8px; margin: 12px 0; }
  button { background: #9146ff; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>BedoZg TikTok Login</h1>
  <p id="msg">Kein Code gefunden.</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Kopieren</button>
  <p><a href="./" style="color:#c9a8ff">Zur Startseite</a></p>
</main>
<script>
  var p = new URLSearchParams(location.search);
  var c = p.get("code"), e = p.get("error");
  if (c) {
    document.getElementById("msg").textContent = "Anmeldung erfolgreich. Diesen Code ins Login-Fenster kopieren:";
    var el = document.getElementById("code"); el.textContent = c; el.hidden = false;
    var b = document.getElementById("copy"); b.hidden = false;
    b.onclick = function () { navigator.clipboard.writeText(c); b.textContent = "Kopiert"; };
  } else if (e) {
    document.getElementById("msg").textContent = "Fehler: " + e + " " + (p.get("error_description") || "");
  }
</script>
</body>
</html>
